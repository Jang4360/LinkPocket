spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health

linkpocket:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
